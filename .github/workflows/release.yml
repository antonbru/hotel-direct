name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Пакет и релиз
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Проверки (синтаксис, манифест, тесты)
        run: npm run check
      - name: Сборка zip
        run: npm run build
      - name: Контрольная сумма
        run: sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          name: Прямые брони ${{ github.ref_name }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
